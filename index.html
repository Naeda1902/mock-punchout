<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mock PunchOut Vendor</title>

<style>
body {
    font-family: Arial;
    width: 900px;
    margin: 40px auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background: #f2f2f2;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Mock PunchOut Vendor Catalog</h2>

<p>Pilih item lalu klik Checkout.</p>

<table>
<tr>
    <th>Item</th>
    <th>Qty</th>
    <th>Price</th>
</tr>

<tr>
    <td>Dell Latitude 5450</td>
    <td>2</td>
    <td>1200 USD</td>
</tr>

<tr>
    <td>Wireless Mouse</td>
    <td>5</td>
    <td>20 USD</td>
</tr>

</table>

<form id="checkoutForm"
      action="https://uat-mp.sandbox.operations.dynamics.com/?mi=CatExternalCatalogBasketWizard"
      method="POST">

    <input
        type="hidden"
        name="cXML-urlencoded"
        id="cxml"/>

</form>

<button onclick="checkout()">
Checkout
</button>

<script>

function checkout() {

const xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE cXML SYSTEM "http://xml.cxml.org/schemas/cXML/1.2.014/cXML.dtd">
<cXML payloadID="dax01" timestamp="2026-08-06T10:00:00Z">
  <!-- Header elements identifying supplier and buyer -->
  <Message>
    <PunchOutOrderMessage operation="create">
      <BuyerCookie>data1234</BuyerCookie>
      <PunchOutOrderMessageHeader>
        <Total><Money currency="USD">274.00</Money></Total>
      </PunchOutOrderMessageHeader>
      <!-- ItemIn defines the line items added to the cart -->
      <ItemIn quantity="1">
        <ItemID><SupplierPartID>ITEM-A100</SupplierPartID></ItemID>
        <ItemDetail>
          <UnitPrice><Money currency="USD">250.00</Money></UnitPrice>
          <Description>Item Description</Description>
        </ItemDetail>
      </ItemIn>
    </PunchOutOrderMessage>
  </Message>
</cXML>`;

document.getElementById("cxml").value = xml;

document.getElementById("checkoutForm").submit();

}

</script>

</body>
</html>
