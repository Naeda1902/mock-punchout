<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mock PunchOut Vendor</title>

<style>
body {
    font-family: Arial;
    width: 900px;
    margin: 40px auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background: #f2f2f2;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Mock PunchOut Vendor Catalog</h2>

<p>Pilih item lalu klik Checkout.</p>

<table>
<tr>
    <th>Item</th>
    <th>Qty</th>
    <th>Price</th>
</tr>

<tr>
    <td>Dell Latitude 5450</td>
    <td>2</td>
    <td>1200 USD</td>
</tr>

<tr>
    <td>Wireless Mouse</td>
    <td>5</td>
    <td>20 USD</td>
</tr>

</table>

<form id="checkoutForm"
      action="https://uat-mp.sandbox.operations.dynamics.com/api/services/ProcurementPunchOutService/PunchOut/ReturnPoint"
      method="POST">

    <input
        type="hidden"
        name="cXML-urlencoded"
        id="cxml"/>

</form>

<button onclick="checkout()">
Checkout
</button>

<script>

function checkout() {

const xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE cXML SYSTEM "http://cxml.org">
<cXML payloadID="cart_response_55521@vendor.com" timestamp="2026-08-06T12:15:00+07:00">
  <Header>
    <!-- From & To posisinya dibalik dibanding dokumen Request -->
    <From>
      <Credential domain="DUNS">
        VENDOR_MAIN_ID
      </Credential>
    </From>
    <To>
      <Credential domain="NetworkID">
        D365_BUYER_CORP
      </Credential>
    </To>
    <Sender>
      <Credential domain="DUNS">
        VENDOR_MAIN_ID
      </Credential>
    </Sender>
  </Header>
  <Message>
    <PunchOutOrderMessage operation="create">
      <!-- VALIDASI UTAMA: Wajib sama persis dengan BuyerCookie di atas -->
      <BuyerCookie>SESSION_TOKEN_XYZ_98765</BuyerCookie>
      <PunchOutOrderMessageHeader operationAllowed="create">
        <Total><Money currency="IDR">2500000.00</Money></Total>
      </PunchOutOrderMessageHeader>
      <!-- Rincian Produk Keranjang Belanja -->
      <ItemIn quantity="1" lineNum="1">
        <ItemID>
          <SupplierPartID>2506000000971</SupplierPartID>
        </ItemID>
        <ItemDetail>
          <UnitPrice><Money currency="IDR">2500000.00</Money></UnitPrice>
          <Description xml:lang="id">BUTTON/KANCING RIBBON RED CNY 26 YESNICE 003</Description>
          <UnitOfMeasure>PCS</UnitOfMeasure>
          <!-- Pastikan kode UNSPSC ini sudah dipetakan di D365 -->
          <Classification domain="Project">Project</Classification>
        </ItemDetail>
      </ItemIn>
    </PunchOutOrderMessage>
  </Message>
</cXML>`;

document.getElementById("cxml").value = xml;

document.getElementById("checkoutForm").submit();

}

</script>

</body>
</html>
