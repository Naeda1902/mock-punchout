<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mock PunchOut Vendor</title>

<style>
body {
    font-family: Arial;
    width: 900px;
    margin: 40px auto;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #ccc;
    padding: 10px;
}
th {
    background: #f2f2f2;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Mock PunchOut Vendor Catalog</h2>
<p>Pilih item lalu klik Checkout.</p>

<table>
<tr>
    <th>Item</th>
    <th>Qty</th>
    <th>Price</th>
</tr>
<tr>
    <td>BUTTON/KANCING RIBBON RED CNY 26 YESNICE 003 </td>
    <td>1</td>
    <td>2500000 IDR</td>
</tr>
</table>

<!-- PERBAIKAN: Action form dialihkan langsung ke endpoint ReturnPoint API, bukan halaman wizard UI -->
<form id="checkoutForm"
      action="https://dynamics.com"
      method="POST">
    <input type="hidden" name="cXML-urlencoded" id="cxml"/>
</form>

<button onclick="checkout()">Checkout</button>

<script>
function checkout() {
const xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE cXML SYSTEM "http://cxml.org">
<cXML payloadID="cart_response_55521@vendor.com" timestamp="2026-08-06T12:15:00+07:00">
  <Header>
    <From>
      <Credential domain="DUNS">
        VENDOR_MAIN_ID
      </Credential>
    </From>
    <To>
      <Credential domain="NetworkID">
        D365_BUYER_CORP
      </Credential>
    </To>
    <Sender>
      <Credential domain="DUNS">
        VENDOR_MAIN_ID
        <SharedSecret>RahasiaKatalog2026!</SharedSecret>
      </Credential>
    </Sender>
  </Header>
  <Message>
    <PunchOutOrderMessage operation="create">
      <!-- WAJIB: Pastikan token ini disamakan secara dinamis saat testing ulang dari D365 -->
      <BuyerCookie>{A6262F48-A0DB-C14F-ED75-CCA3FBA6F152}</BuyerCookie>
      <PunchOutOrderMessageHeader operationAllowed="create">
        <Total><Money currency="IDR">2500000.00</Money></Total>
      </PunchOutOrderMessageHeader>
      <ItemIn quantity="1" lineNum="1">
        <ItemID>
          <SupplierPartID>2506000000971</SupplierPartID>
        </ItemID>
        <ItemDetail>
          <UnitPrice><Money currency="IDR">2500000.00</Money></UnitPrice>
          <Description xml:lang="id">BUTTON/KANCING RIBBON RED CNY 26 YESNICE 003</Description>
          <UnitOfMeasure>PCS</UnitOfMeasure>
          <Classification domain="UNSPSC">Project</Classification>
        </ItemDetail>
      </ItemIn>
    </PunchOutOrderMessage>
  </Message>
</cXML>`;

// Melakukan URL-encoding murni agar karakter khusus aman
document.getElementById("cxml").value = encodeURIComponent(xml);

// Kirim data murni via browser ke D365
document.getElementById("checkoutForm").submit();
}
</script>

</body>
</html>
